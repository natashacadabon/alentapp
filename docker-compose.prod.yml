services: 
    db:
      image: postgres:16-alpine
      container_name: alentapp-db

      # Reinicia automáticamente si el contenedor falla
      restart: unless-stopped

      # Evita hardcodear datos en el repositorio
      environment:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}

      # Persistencia de datos
      volumes:
        - pgdata:/var/lib/postgresql/data

      # Solo accesible desde la red interna backend
      networks:
        - backend

      # Verifica que PostgreSQL realmente esté aceptando conexiones
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
        interval: 10s
        timeout: 5s
        retries: 5

    api:
      build:
        context: .
        dockerfile: packages/api/Dockerfile.prod

      container_name: alentapp-api
      user: appuser
      cap_drop:
        - ALL
        - NET_RAW
      security_opt:
        - no-new-privileges:true
      cap_add:
        - NET_BIND_SERVICE
      restart: unless-stopped

      environment:

        NODE_ENV: production

        # Conexión interna hacia PostgreSQL
        DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

        PORT: 3000

      # La API no inicia hasta que PostgreSQL esté listo para aceptar conexiones
      depends_on:
        db:
          condition: service_healthy

      ports:
        - "3000:3000"
        - "9464:9464"  # Puerto de métricas OpenTelemetry

      # Puede comunicarse con la base y con el frontend
      networks:
        - backend
        - frontend

      # Sistema de archivos protegido contra escritura
      read_only: true

      # Área temporal permitida para archivos temporales
      tmpfs:
        - /tmp

      # Verifica que la API responda correctamente
      healthcheck:
        test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 5

    web:
      build:
        context: .
        dockerfile: packages/web/Dockerfile.prod

      container_name: alentapp-web
      restart: unless-stopped

      # El frontend espera a que la API esté disponible
      depends_on:
        api:
          condition: service_healthy

      ports:
        - "80:8080"

      networks:
        - frontend

      # Evita modificaciones accidentales del contenedor
      read_only: true

      # Directorios temporales requeridos por nginx
      tmpfs:
        - /var/cache/nginx:rw,uid=101,gid=101,mode=1775
        - /var/run:rw,uid=101,gid=101,mode=0755

      # Comprueba que nginx esté respondiendo
      healthcheck:
        test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 5

    prometheus:
      image: prom/prometheus:latest
      container_name: alentapp-prometheus
      restart: unless-stopped

      volumes:
        - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

      ports:
        - "9090:9090"

      networks:
        - monitoring

      extra_hosts:
        - "host.docker.internal:host-gateway"

    grafana:
      image: grafana/grafana:latest
      container_name: alentapp-grafana
      restart: unless-stopped

      environment:
        GF_SECURITY_ADMIN_USER: admin
        GF_SECURITY_ADMIN_PASSWORD: admin

      volumes:
        - grafana_data:/var/lib/grafana

      ports:
        - "3001:3000"

      networks:
        - monitoring

      depends_on:
        - prometheus

volumes:
  # Guarda la información de PostgreSQL
  pgdata:
  # Guarda dashboards y configuración de Grafana
  grafana_data:

networks:
  backend: # Comunicación privada API <-> DB
    driver: bridge
  frontend: # Comunicación privada web <-> API
    driver: bridge
  monitoring: # Prometheus y Grafana
    driver: bridge